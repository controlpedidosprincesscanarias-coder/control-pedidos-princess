services:
  - type: web
    name: control-pedidos-princess
    # (2026-09-07, v12.32.42) runtime: python → docker. Motivo: el PDF de
    # pedido oficial firmado/sellado en papel y vuelto a escanear pierde
    # toda su capa de texto — para poder seguir aceptándolo hace falta OCR
    # (Tesseract, ver _ocr_texto_pdf_pedido_oficial() en app.py), y
    # Tesseract es un paquete del SISTEMA OPERATIVO (no de pip). El
    # runtime nativo de Python de Render no permite apt-get ni ningún otro
    # instalador de sistema (confirmado en la documentación/comunidad de
    # Render) — solo runtime: docker lo permite, ver Dockerfile en la raíz
    # del repo. Fuera de este cambio de runtime, el servicio sigue siendo
    # el mismo (mismo código, mismas variables de entorno, mismo healthcheck).
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # (2026-08-10) --worker-class gthread --threads 4: el "Comparar
    # listado PDF" arranca un hilo en segundo plano para procesar el PDF
    # (ver app.py, _ejecutar_comparacion_pdf_bg) y el navegador sondea el
    # resultado cada 2s con peticiones nuevas mientras tanto. Con el
    # worker "sync" por defecto, el proceso solo puede atender UNA
    # petición a la vez — mientras el hilo de fondo trabaja, el proceso
    # se queda sin poder responder a esos sondeos, y Render puede llegar
    # a considerarlo colgado y reiniciarlo, lo que borra el job en
    # memoria a mitad de proceso ("El job no existe o ha caducado").
    # gthread reparte las peticiones entrantes entre varios hilos del
    # mismo worker, así que los sondeos se siguen atendiendo con
    # normalidad mientras el hilo de fondo hace lo suyo.
    #
    # (2026-09-05, v12.32.30) --timeout 300 → 900: "Departamentos y
    # líneas (SAP detallado)" lee cada página con pdfplumber a mano,
    # tabla por tabla — en la CPU compartida del plan Free de Render
    # esto sale a ~2,6 segundos por página (comprobado con un PDF real
    # de 99 páginas que tardó 259s en producción). Con --timeout 300,
    # un listado de más de ~115 páginas puede volver a dar el mismo
    # síntoma de siempre ("el job no existe o ha caducado"), esta vez
    # por tiempo de CPU, no por memoria — le pasó a Víctor con un
    # listado real de 121 páginas. Investigado si se podía acelerar la
    # lectura en sí (ver CHANGELOG.md v12.32.30): no se encontró forma
    # segura de hacerlo más rápido sin arriesgar el resultado, así que
    # se sube el margen en vez de forzar la velocidad. 900s da margen
    # para listados de hasta unas 300-330 páginas; si Víctor pasa a
    # subir listados semanales (más cortos) como tiene pensado, este
    # margen probablemente ya no hará falta apurarlo tanto.
    # (2026-09-07) startCommand → dockerCommand: mismo comando de siempre,
    # solo cambia el nombre del campo porque runtime: docker lo usa en vez
    # de CMD del Dockerfile (que se deja vacío a propósito, ver ese
    # archivo) — así se sigue pudiendo ajustar aquí, sin reconstruir la
    # imagen.
    dockerCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 4 --timeout 900
    envVars:
      - key: DATABASE_URL
        sync: false          # Lo pegas manualmente en Render → Environment
      - key: SECRET_KEY
        generateValue: true  # Render genera un valor aleatorio seguro automáticamente
      - key: DALI_SSO_SECRET
        sync: false          # Mismo valor que DALI_SSO_SECRET en dali-backend — acceso de un clic al catálogo DALI
      - key: DALI_FRONTEND_URL
        sync: false          # URL pública del frontend de DALI (el Worker de Cloudflare). Por defecto: dali-proxy.centralcompras1-canarias.workers.dev
      - key: PORT
        value: "10000"        # (2026-09-07) runtime: docker no autodetecta el puerto si no se fija
                               # esta variable — con ella, Render sabe a qué puerto interno enrutar
                               # (coincide con EXPOSE 10000 del Dockerfile, ver ese archivo)
    healthCheckPath: /ping
