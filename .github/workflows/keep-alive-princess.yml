name: Keep princess alive (L-V 06:00-18:00 hora Canarias)

on:
  schedule:
    # Ventana ensanchada a propósito para cubrir 06:00-18:00 hora Canarias
    # en LAS DOS estaciones sin tener que editar este archivo dos veces al
    # año (antes había que cambiarlo a mano en el cambio de hora de
    # invierno, y si se olvidaba, el servicio gratuito de Render podía
    # quedarse dormido en horario laboral real):
    #   Verano (UTC+1, marzo-octubre): 06:00-18:00 local = 05:00-17:00 UTC
    #   Invierno (UTC+0, octubre-marzo): 06:00-18:00 local = 06:00-18:00 UTC
    #   Unión de ambas ventanas: 05:00-18:00 UTC → cubre las dos sin tocar
    #   nada. Cuesta ~1h de pings de más en cada extremo según la estación
    #   (gratis, sin límite práctico en el plan free de GitHub Actions).
    - cron: '*/10 5-18 * * 1-5'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions, para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://control-pedidos-princess-1k69.onrender.com/ping)
          echo "Respuesta: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::El ping no devolvió 200 (devolvió $STATUS)"
          fi
