name: Keep princess alive (L-V 06:00-18:00 hora Canarias)

on:
  schedule:
    # 05:00-16:50 UTC = 06:00-17:50 hora Canarias en VERANO (UTC+1, marzo-octubre)
    # ⚠️ En INVIERNO (UTC+0, octubre-marzo) hay que cambiar a: '*/10 6-17 * * 1-5'
    - cron: '*/10 5-16 * * 1-5'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions, para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://control-pedidos-princess.onrender.com/ping)
          echo "Respuesta: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::El ping no devolvió 200 (devolvió $STATUS) — normal mientras el servicio siga suspendido hasta el 1 de agosto"
          fi
